name: sharing-s0
services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: sharing
      POSTGRES_PASSWORD: sharing_local
      POSTGRES_DB: sharing
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sharing-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharing -d sharing"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  sharing-pgdata:
